[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigger-gaps"
version = "0.1.0"
description = "Find SQLite UPDATE OF trigger names that are absent from their table."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["sqlite", "triggers", "schema-validation", "cli", "static-analysis", "continuous-integration"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Database", "Environment :: Console"]

[project.urls]
Repository = "https://github.com/itzjk/trigger-gaps"
Issues = "https://github.com/itzjk/trigger-gaps/issues"

[project.scripts]
trigger-gaps = "trigger_gaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
